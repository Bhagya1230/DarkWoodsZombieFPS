<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2244"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>

  <!-- Misty pine tree silhouettes in background -->
  <path d="M 60 480 L 110 320 L 85 320 L 125 240 L 105 240 L 140 180 L 175 240 L 155 240 L 195 320 L 170 320 L 220 480 Z" fill="#0b1320" opacity="0.6"/>
  <path d="M 300 480 L 350 310 L 325 310 L 370 230 L 350 230 L 390 170 L 430 230 L 410 230 L 455 310 L 430 310 L 480 480 Z" fill="#0b1320" opacity="0.6"/>
  <path d="M 180 490 L 220 360 L 200 360 L 235 290 L 220 290 L 256 230 L 292 290 L 277 290 L 312 360 L 292 360 L 332 490 Z" fill="#080e18" opacity="0.8"/>

  <!-- Zombie Skull / Face Motif -->
  <g transform="translate(156, 120)">
    <!-- Skull Shape -->
    <path d="M 100 20 C 30 20, 10 70, 10 130 C 10 180, 40 210, 60 230 L 60 260 C 60 270, 75 275, 100 275 C 125 275, 140 270, 140 260 L 140 230 C 160 210, 190 180, 190 130 C 190 70, 170 20, 100 20 Z" fill="#2d3748" stroke="#4a5568" stroke-width="4"/>
    
    <!-- Cracked Skull Detail -->
    <path d="M 90 20 L 115 65 L 100 95 L 120 125" fill="none" stroke="#1a202c" stroke-width="4" stroke-linecap="round"/>

    <!-- Glowing Terrifying Eyes -->
    <circle cx="65" cy="125" r="22" fill="#0f172a"/>
    <circle cx="135" cy="125" r="22" fill="#0f172a"/>
    <circle cx="65" cy="125" r="14" fill="url(#eyeGlow)" filter="url(#glow)"/>
    <circle cx="135" cy="125" r="14" fill="url(#eyeGlow)" filter="url(#glow)"/>
    <circle cx="65" cy="125" r="4" fill="#ffffff"/>
    <circle cx="135" cy="125" r="4" fill="#ffffff"/>

    <!-- Nose Cavity -->
    <path d="M 95 160 L 100 145 L 105 160 Z" fill="#111827"/>

    <!-- Teeth / Jaw -->
    <g fill="#e2e8f0" stroke="#1e293b" stroke-width="1.5">
      <rect x="75" y="240" width="10" height="16" rx="2"/>
      <rect x="88" y="240" width="10" height="18" rx="2"/>
      <rect x="102" y="240" width="10" height="18" rx="2"/>
      <rect x="115" y="240" width="10" height="16" rx="2"/>
    </g>
  </g>

  <!-- Crosshairs / Sniper Reticle Overlay -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ef4444" stroke-width="2.5" opacity="0.4" stroke-dasharray="8 8"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6"/>
  <line x1="256" y1="40" x2="256" y2="120" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
  <line x1="256" y1="392" x2="256" y2="472" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
  <line x1="40" y1="256" x2="120" y2="256" stroke="#ef4444" stroke-width="3" opacity="0.8"/>
  <line x1="392" y1="256" x2="472" y2="256" stroke="#ef4444" stroke-width="3" opacity="0.8"/>

  <!-- Wave 16 Badge text at bottom -->
  <text x="256" y="470" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#f87171" text-anchor="middle" letter-spacing="4">DARK WOODS</text>
</svg>
